<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 老三主控台</title><link rel="stylesheet" href="/static/style.css"><script src="/static/login.js" defer></script></head>
<body class="login-page">
<section class="welcome"><div class="brand"><span class="brand-tile"><img src="/static/assets/login-chip.svg" alt=""></span><strong>老三 · ROBOT</strong></div><h1>看见现场，<br>让陪伴更近一步。</h1><p>连接老三的眼睛、耳朵与行动。<br>从一个控制台，照看机器人运行的每个细节。</p><div class="login-illustration"><img src="/static/assets/login-room.svg" alt="机器人控制台的家居场景插画"><span class="scene-badge">视频 · 声音 · 运动</span></div><div class="welcome-tags"><span>实时视频</span><span>硬件监测</span><span>远程控制</span></div><small>WAVESHARE / RASPBERRY PI</small></section>
<main class="login-area"><form id="login-form" class="login-form"><span class="badge">设备管理后台</span><div><h2>欢迎回来</h2><p>使用管理员账号，连接你的机器人。</p></div><label>用户名<input value="admin" autocomplete="username" readonly aria-readonly="true"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required placeholder="请输入管理员密码"></label><button class="primary" type="submit">登录控制台</button><p class="secure-hint"><img src="/static/assets/lock.svg" alt="">登录后可在账号设置中修改密码</p><p id="login-error" role="alert">{% if not initialized %}管理员尚未初始化，请在 Mini 终端运行 robot-console admin init。{% endif %}</p><hr><small>仅限授权管理员访问</small></form><footer>老三控制台 · 为家中的机器人而设计</footer></main>
</body></html>
