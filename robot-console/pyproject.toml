[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tv-pet-console"
version = "0.13.3"
description = "Mac Mini robot management console"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "jinja2>=3.1", "pillow>=11,<12", "argon2-cffi>=23", "sqlalchemy>=2,<3", "alembic>=1.14", "httpx>=0.28,<1", "ai-tv-pet-pi-agent"]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1,<2"]

[project.scripts]
robot-console = "tvpet_console.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvpet_console = ["web/*", "web/assets/*", "migrations/*", "migrations/versions/*"]
