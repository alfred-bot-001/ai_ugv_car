# Include in the existing Nginx http context; replace the car server block.
map $http_upgrade $robot_console_connection_upgrade {
    default upgrade;
    '' close;
}

# Never persist SSO authorization codes or browser transaction state in URLs.
map $uri $robot_console_loggable {
    default 1;
    ~^/auth/sso/ 0;
}

server {
    listen 8443 ssl;
    server_name car.aimaker.vip;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/wildcard-origin.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/wildcard-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/car.access.log combined if=$robot_console_loggable;
    error_log  /opt/homebrew/var/log/nginx/car.error.log;

    # Existing independent TV gateway.
    location /tv/ {
        proxy_pass http://127.0.0.1:9444/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # The Pi's token-bearing channels use the private LAN endpoint.
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }

    # Do not log callback query strings, including upstream failure request lines.
    # Authentication outcomes remain in the applications' metadata-only audit.
    location ^~ /auth/sso/ {
        access_log off;
        error_log /dev/null;
        client_max_body_size 16k;
        proxy_pass https://127.0.0.1:8788;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /Users/agent001/workspace-agent/deploy/ai-tv-pet-console/private/mini-ca.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify_depth 2;
        proxy_http_version 1.1;
        proxy_set_header Host car.aimaker.vip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10s;
    }

    location / {
        client_max_body_size 16k;
        proxy_pass https://127.0.0.1:8788;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /Users/agent001/workspace-agent/deploy/ai-tv-pet-console/private/mini-ca.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify_depth 2;

        proxy_http_version 1.1;
        proxy_set_header Host car.aimaker.vip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $robot_console_connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
    }
}
