[project]
name = "ai-ugv-car-workspace"
version = "0.2.0"
requires-python = ">=3.11,<3.12"
dependencies = ["ai-tv-pet-console", "ai-tv-pet-pi-agent"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["robot-console", "pi-agent"]

[tool.uv.sources]
ai-tv-pet-console = { workspace = true }
ai-tv-pet-pi-agent = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.9", "mypy>=1.14", "types-pyserial", "playwright>=1.49"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["robot-console/**/*.py", "pi-agent/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["robot-console/src", "pi-agent/src"]

[tool.pytest.ini_options]
testpaths = ["robot-console/tests", "pi-agent/tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["tvpet_console", "tvpet_pi"]

