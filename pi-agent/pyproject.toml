[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tv-pet-pi-agent"
version = "0.12.0"
description = "Raspberry Pi device, capture and interaction agent for AI TV Pet"
requires-python = ">=3.11,<3.12"
dependencies = ["websockets>=12,<13", "pyserial>=3.5", "pydantic>=2.10,<3", "httpx>=0.27"]

[project.scripts]
tvpet-pi = "tvpet_pi.__main__:main"
tvpet-gimbal-center = "tvpet_pi.gimbal_center:main"
tvpet-tof = "tvpet_pi.tof_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
