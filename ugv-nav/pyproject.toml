[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ugv-car-nav-tools"
version = "0.1.0"
description = "ROS2 navigation helpers for the 老三 UGV Rover; runs inside the ugv-nav container"
# The ROS2 Humble container ships Python 3.10; rclpy comes from ROS, not PyPI.
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ugv-scan-report = "ugv_nav_tools.scan_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py310"

[tool.ruff.lint.isort]
# ./launch holds ROS launch files; the `launch` import is the ROS package.
known-third-party = ["launch", "launch_ros"]
known-first-party = ["ugv_nav_tools"]
