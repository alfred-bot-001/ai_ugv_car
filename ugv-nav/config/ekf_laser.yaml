# Accepted on the car 2026-10-13: fuse RF2O x/y/yaw only. Wheel yaw on the six-wheel
# skid chassis disagrees with laser yaw, and the IMU readings are not trustworthy yet.
ekf_laser:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: true
    transform_time_offset: 0.05
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /odom_rf2o
    odom0_config: [true, true, false, false, false, true,
                   false, false, false, false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5
    print_diagnostics: true
