name: ugv-nav
services:
  ugv-nav:
    image: ai-ugv-car/ugv-nav:${UGV_NAV_VERSION:-0.8.3}
    build: .
    container_name: ugv-nav
    network_mode: host
    restart: "no"
    # dialout (gid 20) for the LiDAR tty; never map /dev/ttyAMA0, the M2 or audio devices.
    group_add: ["20"]
    devices:
      - /dev/ugv_lidar:/dev/ugv_lidar
    # pi-agent's 0600 socket (owner ws, uid 1000 = container user); read-only bind.
    volumes:
      - /home/ws/deploy/ai-tv-pet-agent/nav:/board:ro
      # Household data lives apart from the application (2026-10-22, user request).
      - /home/ws/workspace-agent/agent-data/ai-ugv-car/ugv-nav/maps:/maps
      - /home/ws/workspace-agent/agent-data/ai-ugv-car/ugv-nav/reports:/reports
    # ugv-navctl writes .env next to this file to switch mapping / localization.
    environment:
      UGV_NAV_LAUNCH: ${UGV_NAV_LAUNCH:-n1_odometry}
      UGV_NAV_ARGS: ${UGV_NAV_ARGS:-}
    read_only: true
    tmpfs: [/tmp]
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      # Board telemetry fresh and /scan flowing, both from the file the bridge writes every
      # second. No ROS CLI here (2026-10-25): `timeout ros2 topic hz | grep -q` killed a DDS
      # participant every 30 s, left Fast DDS shared-memory ports behind (85 in /dev/shm)
      # and twice froze another node's /tf subscription (SLAM, then the controller).
      test: ["CMD", "python3", "-c", "import json,time,sys; b=json.load(open('/tmp/board_health.json')); sys.exit(not (0 <= time.monotonic()-b['monotonic'] < 4 and b['age'] < 0.3 and b.get('scan_age', 9) < 2))"]
      interval: 30s
      timeout: 15s
      retries: 3
